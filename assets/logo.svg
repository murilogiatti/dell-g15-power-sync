<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141821"/>
      <stop offset="55%" stop-color="#0C0F14"/>
      <stop offset="100%" stop-color="#07090C"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="35%" stop-color="#00E676"/>
      <stop offset="70%" stop-color="#FFB366"/>
      <stop offset="100%" stop-color="#FF2200"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Chamfered G15 Gaming Shield -->
  <polygon points="96,28 416,28 484,96 484,416 416,484 96,484 28,416 28,96"
           fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="10" stroke-linejoin="round"/>

  <!-- Subtle Inner Tech Bezel -->
  <polygon points="108,46 404,46 466,108 466,404 404,466 108,466 46,404 46,108"
           fill="none" stroke="#222A38" stroke-width="2"/>

  <!-- Top Vent Accents (Dell G15 Thermal Vent Style) -->
  <g fill="#1F2735">
    <rect x="136" y="60" width="36" height="8" rx="4"/>
    <rect x="184" y="60" width="36" height="8" rx="4"/>
    <rect x="292" y="60" width="36" height="8" rx="4"/>
    <rect x="340" y="60" width="36" height="8" rx="4"/>
  </g>

  <!-- Ambient Sync Display Frame & Light Projection -->
  <path d="M 116 96 L 396 96 L 412 224 L 100 224 Z"
        fill="#0F141D" stroke="#00E5FF" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 122 102 L 390 102 L 404 218 L 108 218 Z"
        fill="url(#screenGlow)"/>

  <!-- Ambient Brightness Rays / Sync Symbol inside Display -->
  <circle cx="256" cy="144" r="18" fill="#E6E6E6" filter="url(#neonGlow)"/>
  <g stroke="#00E5FF" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="112" x2="256" y2="118"/>
    <line x1="256" y1="170" x2="256" y2="176"/>
    <line x1="224" y1="144" x2="230" y2="144"/>
    <line x1="282" y1="144" x2="288" y2="144"/>
    <line x1="233" y1="121" x2="238" y2="126"/>
    <line x1="274" y1="162" x2="279" y2="167"/>
    <line x1="279" y1="121" x2="274" y2="126"/>
    <line x1="238" y1="162" x2="233" y2="167"/>
  </g>

  <!-- G15 Emblem Typography -->
  <text x="256" y="208" text-anchor="middle" fill="#E6E6E6"
        font-family="Ubuntu, Cantarell, system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="4">
    G15 SYNC
  </text>

  <!-- 4-Zone Isometric RGB Keyboard Deck -->
  <rect x="68" y="250" width="376" height="156" rx="16"
        fill="#090C10" stroke="#2A3446" stroke-width="3"/>

  <!-- Zone 1: Left / WASD (#00E5FF Alienware Cyan) -->
  <g filter="url(#neonGlow)">
    <rect x="84" y="266" width="82" height="108" rx="8" fill="#00E5FF" fill-opacity="0.18" stroke="#00E5FF" stroke-width="2.5"/>
    <rect x="94" y="278" width="16" height="16" rx="3" fill="#00E5FF"/>
    <rect x="116" y="278" width="16" height="16" rx="3" fill="#E6E6E6"/>
    <rect x="138" y="278" width="16" height="16" rx="3" fill="#00E5FF"/>
    <rect x="94" y="302" width="16" height="16" rx="3" fill="#E6E6E6"/>
    <rect x="116" y="302" width="16" height="16" rx="3" fill="#E6E6E6"/>
    <rect x="138" y="302" width="16" height="16" rx="3" fill="#E6E6E6"/>
    <rect x="94" y="326" width="60" height="14" rx="3" fill="#00E5FF"/>
    <rect x="84" y="384" width="82" height="8" rx="4" fill="#00E5FF"/>
  </g>

  <!-- Zone 2: Center-Left (#00E676 Matrix Green) -->
  <g filter="url(#neonGlow)">
    <rect x="174" y="266" width="80" height="108" rx="8" fill="#00E676" fill-opacity="0.18" stroke="#00E676" stroke-width="2.5"/>
    <rect x="184" y="278" width="16" height="16" rx="3" fill="#00E676"/>
    <rect x="206" y="278" width="16" height="16" rx="3" fill="#00E676"/>
    <rect x="228" y="278" width="16" height="16" rx="3" fill="#00E676"/>
    <rect x="184" y="302" width="16" height="16" rx="3" fill="#00E676"/>
    <rect x="206" y="302" width="16" height="16" rx="3" fill="#00E676"/>
    <rect x="228" y="302" width="16" height="16" rx="3" fill="#00E676"/>
    <rect x="184" y="326" width="60" height="14" rx="3" fill="#E6E6E6"/>
    <rect x="174" y="384" width="80" height="8" rx="4" fill="#00E676"/>
  </g>

  <!-- Zone 3: Center-Right (#FFB366 Warm Amber) -->
  <g filter="url(#neonGlow)">
    <rect x="262" y="266" width="80" height="108" rx="8" fill="#FFB366" fill-opacity="0.18" stroke="#FFB366" stroke-width="2.5"/>
    <rect x="272" y="278" width="16" height="16" rx="3" fill="#FFB366"/>
    <rect x="294" y="278" width="16" height="16" rx="3" fill="#FFB366"/>
    <rect x="316" y="278" width="16" height="16" rx="3" fill="#FFB366"/>
    <rect x="272" y="302" width="16" height="16" rx="3" fill="#FFB366"/>
    <rect x="294" y="302" width="16" height="16" rx="3" fill="#FFB366"/>
    <rect x="316" y="302" width="16" height="16" rx="3" fill="#FFB366"/>
    <rect x="272" y="326" width="60" height="14" rx="3" fill="#FFB366"/>
    <rect x="262" y="384" width="80" height="8" rx="4" fill="#FFB366"/>
  </g>

  <!-- Zone 4: NumPad (#FF2200 G15 Red-Orange) -->
  <g filter="url(#neonGlow)">
    <rect x="350" y="266" width="78" height="108" rx="8" fill="#FF2200" fill-opacity="0.18" stroke="#FF2200" stroke-width="2.5"/>
    <rect x="360" y="278" width="15" height="16" rx="3" fill="#FF2200"/>
    <rect x="381" y="278" width="15" height="16" rx="3" fill="#FF2200"/>
    <rect x="402" y="278" width="15" height="16" rx="3" fill="#E6E6E6"/>
    <rect x="360" y="302" width="15" height="16" rx="3" fill="#FF2200"/>
    <rect x="381" y="302" width="15" height="16" rx="3" fill="#FF2200"/>
    <rect x="402" y="302" width="15" height="38" rx="3" fill="#FF2200"/>
    <rect x="360" y="326" width="36" height="14" rx="3" fill="#FF2200"/>
    <rect x="350" y="384" width="78" height="8" rx="4" fill="#FF2200"/>
  </g>

  <!-- Bottom Status Indicator Bar -->
  <rect x="176" y="432" width="160" height="12" rx="6" fill="url(#rimGrad)"/>
</svg>
