<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- High-contrast top-bar notification icon with 4-zone RGB underglow -->
  <rect x="4" y="12" width="56" height="36" rx="7" fill="#181E29" stroke="#E6E6E6" stroke-width="3"/>

  <!-- Key Row 1 -->
  <rect x="10" y="18" width="7" height="6" rx="1.5" fill="#00E5FF"/>
  <rect x="20" y="18" width="7" height="6" rx="1.5" fill="#E6E6E6"/>
  <rect x="30" y="18" width="7" height="6" rx="1.5" fill="#E6E6E6"/>
  <rect x="40" y="18" width="7" height="6" rx="1.5" fill="#E6E6E6"/>
  <rect x="49" y="18" width="5" height="6" rx="1.5" fill="#FF2200"/>

  <!-- Key Row 2 -->
  <rect x="10" y="27" width="7" height="6" rx="1.5" fill="#E6E6E6"/>
  <rect x="20" y="27" width="7" height="6" rx="1.5" fill="#00E676"/>
  <rect x="30" y="27" width="7" height="6" rx="1.5" fill="#FFB366"/>
  <rect x="40" y="27" width="7" height="6" rx="1.5" fill="#E6E6E6"/>
  <rect x="49" y="27" width="5" height="6" rx="1.5" fill="#FF2200"/>

  <!-- Spacebar Row -->
  <rect x="10" y="36" width="8" height="5" rx="1.5" fill="#00E5FF"/>
  <rect x="21" y="36" width="22" height="5" rx="1.5" fill="#E6E6E6"/>
  <rect x="46" y="36" width="8" height="5" rx="1.5" fill="#FF2200"/>

  <!-- 4-Zone Underglow Strip -->
  <rect x="6"  y="52" width="12" height="5" rx="2.5" fill="#00E5FF"/>
  <rect x="20" y="52" width="11" height="5" rx="2.5" fill="#00E676"/>
  <rect x="33" y="52" width="11" height="5" rx="2.5" fill="#FFB366"/>
  <rect x="46" y="52" width="12" height="5" rx="2.5" fill="#FF2200"/>
</svg>
